name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: aceest-fitness

jobs:
  # 1. Build & Lint: install dependencies, check syntax and style.
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check for syntax errors and undefined names
        run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (full flake8 rule set)
        run: flake8 . --statistics

      - name: Compile sources
        run: python -m compileall -q app.py aceest

      - name: Import smoke test
        run: python -c "from app import app; print(sorted(r.rule for r in app.url_map.iter_rules()))"

  # 2. Docker Image Assembly: build the test and runtime images.
  docker-build:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: build-lint
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t $IMAGE:test .

      - name: Build runtime image
        run: docker build --target runtime -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Show image sizes
        run: docker images $IMAGE

      - name: Save images for the test job
        run: docker save $IMAGE:test $IMAGE:latest | gzip > images.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar.gz
          retention-days: 1

  # 3. Automated Testing: run pytest inside the container, then smoke-test the runtime image.
  test:
    name: Automated Testing (in container)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: gunzip -c images.tar.gz | docker load

      - name: Run pytest inside the container
        run: |
          docker run --name pytest-run $IMAGE:test \
            pytest -v -p no:cacheprovider \
              --junitxml=/tmp/junit.xml \
              --cov=aceest --cov-report=term-missing --cov-fail-under=90

      - name: Collect test report
        if: always()
        run: docker cp pytest-run:/tmp/junit.xml junit.xml || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: junit.xml
          if-no-files-found: ignore

      - name: Smoke-test runtime container
        run: |
          docker run -d --name app -p 5000:5000 $IMAGE:latest
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/health; then echo; break; fi
            sleep 1
          done
          curl -sf http://localhost:5000/programs > /dev/null
          test "$(docker exec app id -u)" != "0"   # must not run as root
          docker logs app

      - name: Stop container
        if: always()
        run: docker rm -f app || true
